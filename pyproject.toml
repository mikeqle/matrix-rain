[project]
name = "matrix-waterfall"
version = "0.1.0"
description = "Matrix digital rain effect for the terminal"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["matrix_rain.py"]

[project.scripts]
matrix-rain = "matrix_rain:cli_entry"
