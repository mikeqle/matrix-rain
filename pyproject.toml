[project]
name = "matrix-rain"
version = "0.1.0"
description = "Matrix digital rain effect for the terminal"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["matrix_rain"]

[project.scripts]
matrix-rain = "matrix_rain:cli_entry"
